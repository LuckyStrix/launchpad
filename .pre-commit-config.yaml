# Install with: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1 # keep in step with backend/requirements-dev.txt
    hooks:
      - id: ruff
        args: [--config, backend/ruff.toml]
        files: ^backend/
